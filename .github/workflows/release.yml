name: App release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Package universal app
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./scripts/package-release.sh "$GITHUB_REF_NAME"
          else
            ./scripts/package-release.sh
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: PaneRook-macOS-universal
          path: build/release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: PaneRook-macOS-universal
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "PaneRook $version" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "PaneRook $version" --generate-notes
          fi
